version: "3.8"

services:
  it-ticket-web:
    image: registry.archetype-group.com/it-ticket-web:${IMAGE_TAG}
    networks:
      - traefik-public
    deploy:
      replicas: 2
      update_config:
        order: start-first
        failure_action: rollback
        delay: 5s
        monitor: 20s
      rollback_config:

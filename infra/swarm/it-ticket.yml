        - "traefik.http.services.it-ticket.loadbalancer.healthcheck.timeout=3s"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/it-ticket/api/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s


packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  esbuild: true
  msw: true
# Force patched versions of transitive deps that only Storybook's OWN toolchain
# (devDependency, build-time only - never shipped) pulls in, which haven't bumped
# their own deps yet - found by `pnpm audit`, not pinned by any direct dependency of
# ours (see CLAUDE.md's "Known pending item" for the one REAL, currently-unfixable
# exception, zod - these 3 are fixable and should stay patched, not re-added here).
overrides:
  "uuid@<11.1.1": ">=11.1.1"
  "glob@>=9.0.0 <=14.0.1": ">=14.0.2"
  "minimatch@>=7.0.0 <11.0.1": ">=11.0.1"

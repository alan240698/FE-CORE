name: CI Frontend

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # REQUIRED for Turborepo's affected-package filtering (--filter=...[ref]) to
          # work at all - a shallow checkout (the default) makes the git diff Turborepo
          # needs unavailable, and it silently falls back to treating everything as
          # changed instead of erroring loudly. See setup-tu-zero-archetype-frontend.md.
          fetch-depth: 0

      - name: Enable corepack (pnpm)
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check generated infra files are up to date
        run: pnpm run generate-infra:check

      # NEXT_PUBLIC_* values are baked into the client bundle at build time and are
      # never secret. Reads from environments.config.ts (the SAME source
      # apps/*/.env.example is generated from) instead of a 3rd hand-copied value, so
      # there's one place to change it, not three. .env.local is gitignored on purpose
      # (per-developer/per-environment override), so CI has no other source for it;
      # without this, `next build` fails fast with "Invalid environment variables" (Zod,
      # see packages/env-schema) because the runner has no .env.local at all.
      # "pnpm exec tsx" directly (not "pnpm run print-env") - pnpm run prints a "$ ..."
      # banner line before the script's own output, which would corrupt $GITHUB_ENV.
      - name: Load shared environment config
        run: pnpm exec tsx scripts/print-env.ts >> "$GITHUB_ENV"

      - name: Lint, type-check, test, build
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            pnpm exec turbo run lint type-check test build --filter="...[origin/${{ github.base_ref }}]"
          else
            pnpm exec turbo run lint type-check test build
          fi

      # The GitHub-hosted runner has real root, unlike the sandboxed dev environment this
      # was first built in (which needed a manual apt-get-download workaround documented
      # in setup-tu-zero-archetype-frontend.md) - --with-deps works normally here.
      - name: Install Playwright browsers
        run: pnpm --filter @archetype/it-ticket exec playwright install --with-deps chromium

      - name: Run E2E tests
        run: pnpm --filter @archetype/it-ticket run e2e

      - name: Check for circular dependencies
        run: pnpm run depcruise

      - name: Check formatting
        run: pnpm exec prettier --check .

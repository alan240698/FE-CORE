name: CI Frontend

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # REQUIRED for Turborepo's affected-package filtering (--filter=...[ref]) to
          # work at all - a shallow checkout (the default) makes the git diff Turborepo
          # needs unavailable, and it silently falls back to treating everything as
          # changed instead of erroring loudly. See setup-tu-zero-archetype-frontend.md.
          fetch-depth: 0

      - name: Enable corepack (pnpm)
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check generated infra files are up to date
        run: pnpm run generate-infra:check

      # NEXT_PUBLIC_* values are baked into the client bundle at build time and are
      # never secret. Reads from environments.config.ts (the SAME source
      # apps/*/.env.example is generated from) instead of a 3rd hand-copied value, so
      # there's one place to change it, not three. .env.local is gitignored on purpose
      # (per-developer/per-environment override), so CI has no other source for it;
      # without this, `next build` fails fast with "Invalid environment variables" (Zod,
      # see packages/env-schema) because the runner has no .env.local at all.
      # "pnpm exec tsx" directly (not "pnpm run print-env") - pnpm run prints a "$ ..."
      # banner line before the script's own output, which would corrupt $GITHUB_ENV.
      - name: Load shared environment config
        run: pnpm exec tsx scripts/print-env.ts >> "$GITHUB_ENV"

      - name: Lint, type-check, test, build
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            pnpm exec turbo run lint type-check test build --filter="...[origin/${{ github.base_ref }}]"
          else
            pnpm exec turbo run lint type-check test build
          fi

      # scripts/run-e2e.ts discovers every app with an e2e/ suite and runs it - new
      # modules scaffolded by scripts/create-module.ts are picked up automatically,
      # instead of CI needing a hand-edit per module (see finding SCALE-6). The
      # GitHub-hosted runner has real root, unlike the sandboxed dev environment this
      # was first built in (which needed a manual apt-get-download workaround documented
      # in setup-tu-zero-archetype-frontend.md) - --with-deps works normally here.
      - name: Run E2E tests
        run: pnpm exec tsx scripts/run-e2e.ts

      # Scans the full git history (fetch-depth: 0 above makes that possible) for
      # committed secrets - --only-verified keeps this a HARD gate (no
      # continue-on-error, unlike the audit step below): a verified secret is never a
      # false positive worth shipping past, whereas the zod CVE below has a real,
      # currently-unresolvable blocker. TruffleHog OSS, not gitleaks-action - gitleaks
      # v2 requires a paid GITLEAKS_LICENSE for GitHub Organization accounts, which
      # this repo has not set up; TruffleHog's GitHub Action has no license
      # requirement either way.
      - name: Secret scan (TruffleHog)
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

      - name: Check for circular dependencies
        run: pnpm run depcruise

      - name: Check formatting
        run: pnpm exec prettier --check .

      # continue-on-error (not a hard gate yet): running this for real found 2 CRITICAL
      # advisories (tinypool, via vitest) - fixed in the same change that added this
      # step, by bumping vitest 3->4 (verified: full pipeline + e2e + 3x repeated test
      # runs, all green). 1 HIGH (zod <4.6.6) remains and is NOT fixable right now -
      # @t3-oss/env-nextjs (packages/env-schema) pins a hard peerDependency on
      # "zod": "^3.0.0", so bumping zod to the patched v4 line would break the env
      # validation every app depends on. Tracked in root CLAUDE.md's "Known pending
      # item" until @t3-oss/env-nextjs supports zod v4. This step stays non-blocking
      # (visible on every run, not silently ignored) until that's resolved - flip
      # continue-on-error to false once it is.
      #
      # 3 MODERATE findings (uuid/glob/minimatch, all transitive deps of Storybook's
      # own toolchain) existed silently since this step was first added and were never
      # triaged - only the zod HIGH above was ever documented. Fixed via
      # pnpm-workspace.yaml's "overrides" (forces the patched versions; Storybook's own
      # package.json hadn't bumped them yet) - verified Storybook itself still builds
      # (`storybook build`) after the override. `pnpm audit` now reports exactly the
      # one documented zod finding, nothing silent left.
      - name: Dependency vulnerability scan
        run: pnpm audit --audit-level=high
        continue-on-error: true

      # Informational, not a gate - no agreed bundle-size budget exists yet (only 2
      # apps, 1 real module). Visible per-run so size creep is noticed before it
      # becomes a problem, without blocking merges on an arbitrary threshold nobody
      # has agreed on.
      - name: Report bundle size
        if: always()
        run: |
          echo "## Bundle size (.next/static)" >> "$GITHUB_STEP_SUMMARY"
          for app in apps/*/; do
            name=$(basename "$app")
            if [ -d "${app}.next/static" ]; then
              size=$(du -sh "${app}.next/static" | cut -f1)
              echo "- **${name}**: ${size}" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
